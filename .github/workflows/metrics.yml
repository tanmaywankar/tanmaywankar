name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs daily at midnight
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # LEFT CARD: Overview, Activity, Languages
      - name: Metrics - Overview & Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanmaywankar
          template: classic
          base: header, activity, community, metadata
          base_hireable: yes
          config_timezone: Asia/Calcutta
          
          # Detailed Languages Breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: css, html
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # RIGHT CARD: 3D Calendar, PR/Issue Status, Lines of Code
      - name: Metrics - Activity & Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanmaywankar
          template: classic
          base: "" # Disables standard header so it starts directly with stats
          config_timezone: Asia/Calcutta

          # Follow-up status (PRs & Issues)
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          # Lines of code modified
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # 3D Isometric Contributions
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
