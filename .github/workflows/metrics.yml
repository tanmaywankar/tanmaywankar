name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Daily at midnight
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # LEFT CARD: Issues/PRs status + Languages (with MB sizes)
      - name: Left Column
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanmaywankar
          template: classic
          base: ""
          config_timezone: Asia/Calcutta

          # Issues & PRs status
          plugin_followup: yes
          plugin_followup_sections: user

          # Languages with exact byte size & percentages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: css, html
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%

      # RIGHT CARD: Starred Topics + Notable Repos + 3D IsoCalendar
      - name: Right Column
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanmaywankar
          template: classic
          base: ""
          config_timezone: Asia/Calcutta

          # Starred Topics Icons (from github.com/topics)
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons
          plugin_topics_limit: 15

          # Notable contributions (highlights merged PRs like frappe/gantt)
          plugin_notable: yes
          plugin_notable_types: commit, pull_request

          # 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
